name: InDrive (fka inDriver)
description: InDrive (formerly inDriver) is a global mobility and urban-services platform
  operating in roughly 48 countries and more than 1,000 cities, with over 400 million app
  downloads. It is built on a distinctive peer-to-peer, user-proposed pricing model in which
  riders name a fare and nearby drivers accept, counter, or decline, rather than an algorithm
  setting the price. Beyond ride-hailing, InDrive spans intercity (city-to-city) rides, courier
  and freight delivery, and financial services, and is expanding into a "super app" for frontier
  markets. InDrive does not currently publish a public third-party developer API; this API
  Evangelist profile captures its public company, engineering, and legal surface.
